<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>zen mode</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="cv"></canvas>
  
  <nav>
    <button id="openFileBtn" title="open file">↑</button>
    <button id="showKeyboardBtn" title="show keyboard">⌨</button>
    <button id="cmdBtn" onclick="toggleCommandPalette()" title="commands">?</button>
    <button id="selectTextBtn" title="show all text">≡</button>
    <button id="downloadBtn" title="download">↓</button>
    <button id="settingsBtn" title="settings">⚙</button>
  </nav>

  <input type="file" id="folderIcon" style="display:none" />

  <div id="cmdPalette" class="modal">
    <input type="text" placeholder="type a command..." />
  </div>

  <div id="selectTextPopup" class="modal">
    <textarea id="editorTextDump" style="width:100%;height:200px;resize:vertical;"></textarea>
    <div class="modal-footer">
      <button id="closeSelectTextPopup">close</button>
    </div>
  </div>

  <div id="settingsModal" class="modal">
    <h2>settings</h2>
    <div>
      <label for="zoomSlider">zoom: <span id="zoomValue">100%</span></label>
      <input type="range" id="zoomSlider" min="50" max="300" value="100" />
    </div>
    <div class="modal-footer">
      <button id="closeSettingsBtn">close</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
