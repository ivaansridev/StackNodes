[package]
name = "stacknodes"
version = "0.1.0"
description = "StackNodes - a hierarchical node-based outliner"
authors = ["ivaansrivastavadev"]
license = "MIT"
edition = "2021"

[lib]
name = "stacknodes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
